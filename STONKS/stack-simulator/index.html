<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Stack Simulator (LIFO)</h1>

    <div class="controls">
      <input type="text" id="stack-input" placeholder="Enter value">
      <button id="btn-push">Push</button>
      <button id="btn-pop">Pop</button>
      <button id="btn-peek">Peek</button>
      <button id="btn-clear">Clear</button>
    </div>

    <div id="message" class="message"></div>

    <div class="simulator-body">
      <div class="display-section">
        <h3>Stack Container (Top at Top)</h3>
        <div id="stack-container" class="data-container"></div>
      </div>

      <div class="display-section">
        <h3>Deleted Area</h3>
        <div id="deleted-container" class="data-container"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
